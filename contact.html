<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Anthony Nduka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#0055FF',
                            black: '#0A0A0A',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .brutal-shadow { box-shadow: 6px 6px 0px 0px #0A0A0A; }
        .brutal-shadow-blue { box-shadow: 6px 6px 0px 0px #0055FF; }
        .brutal-hover:hover { transform: translate(4px, 4px); box-shadow: 2px 2px 0px 0px #0A0A0A; }
        
        /* Form Input Focus Styles */
        input:focus, textarea:focus {
            outline: none;
            box-shadow: 4px 4px 0px 0px #0055FF;
            transform: translate(-2px, -2px);
            transition: all 0.2s ease;
        }
    </style>
</head>
<body class="bg-[#f4f4f4] text-brand-black font-sans antialiased selection:bg-brand-blue selection:text-white flex flex-col min-h-screen">

    <!-- CENTERED NAVIGATION BAR -->
    <nav class="border-b-4 border-brand-black bg-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-center items-center overflow-x-auto">
            <ul class="flex space-x-2 md:space-x-8 font-display font-bold text-sm md:text-lg whitespace-nowrap">
                <li><a href="index.html" class="px-3 py-2 border-2 border-transparent hover:border-brand-black hover:bg-brand-blue hover:text-white transition-colors">HOME</a></li>
                <li><a href="products.html" class="px-3 py-2 border-2 border-transparent hover:border-brand-black hover:bg-brand-blue hover:text-white transition-colors">PRODUCTS</a></li>
                <li><a href="work.html" class="px-3 py-2 border-2 border-transparent hover:border-brand-black hover:bg-brand-blue hover:text-white transition-colors">WORK</a></li>
                <li><a href="about.html" class="px-3 py-2 border-2 border-transparent hover:border-brand-black hover:bg-brand-blue hover:text-white transition-colors">ABOUT</a></li>
                <li><a href="archives.html" class="px-3 py-2 border-2 border-transparent hover:border-brand-black hover:bg-brand-blue hover:text-white transition-colors">ARCHIVES</a></li>
                <li><a href="contact.html" class="px-3 py-2 border-2 border-transparent hover:border-brand-black hover:bg-brand-blue hover:text-white transition-colors bg-brand-black text-white">CONTACT</a></li>
            </ul>
        </div>
    </nav>

    <!-- HEADER -->
    <section class="bg-brand-blue text-white py-20 border-b-4 border-brand-black">
        <div class="max-w-6xl mx-auto px-6">
            <h1 class="font-display text-5xl lg:text-7xl font-bold mb-4">Let's Build.</h1>
            <p class="text-xl font-medium max-w-2xl">Looking to scale a community, book a speaker, or discuss a Web3 partnership? Drop a message below.</p>
        </div>
    </section>

    <!-- CONTACT SECTION -->
    <section class="max-w-6xl mx-auto px-6 py-24 flex-grow w-full">
        <div class="grid lg:grid-cols-12 gap-12">
            
            <!-- LEFT: CONTACT INFO -->
            <div class="lg:col-span-5 space-y-12">
                <div>
                    <h2 class="font-display text-3xl font-bold mb-6">Location</h2>
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-white border-4 border-brand-black brutal-shadow flex items-center justify-center text-xl font-bold">📍</div>
                        <div>
                            <p class="font-display font-bold text-2xl">Nigeria</p>
                        </div>
                    </div>
                </div>

                <div>
                    <h2 class="font-display text-3xl font-bold mb-6">Socials</h2>
                    <div class="flex gap-4">
                        <!-- X (Twitter) Logo -->
                        <a href="https://x.com/yourhandle" target="_blank" class="w-16 h-16 bg-white text-brand-black border-4 border-brand-black brutal-shadow brutal-hover flex items-center justify-center transition-all">
                            <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>
                            </svg>
                        </a>
                        
                        <!-- LinkedIn Logo -->
                        <a href="https://linkedin.com/in/yourhandle" target="_blank" class="w-16 h-16 bg-brand-blue text-white border-4 border-brand-black brutal-shadow brutal-hover flex items-center justify-center transition-all">
                            <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                            </svg>
                        </a>

                        <!-- GitHub Logo -->
                        <a href="https://github.com/yourhandle" target="_blank" class="w-16 h-16 bg-brand-black text-white border-4 border-brand-black brutal-shadow brutal-hover flex items-center justify-center transition-all">
                            <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </div>

            <!-- RIGHT: THE FORM -->
            <div class="lg:col-span-7">
                <div class="bg-white border-4 border-brand-black p-8 md:p-12 brutal-shadow">
                    <h2 class="font-display text-3xl font-bold mb-8">Send a Message</h2>
                    
                    <!-- data-netlify="true" is all you need for Netlify to capture the form -->
                    <form name="Portfolio_Contact" method="POST" data-netlify="true" class="space-y-6">
                        <input type="hidden" name="form-name" value="Portfolio_Contact" />

                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label for="name" class="block font-bold mb-2">Name *</label>
                                <input type="text" id="name" name="name" required class="w-full bg-[#f4f4f4] border-4 border-brand-black p-3 font-medium transition-all" placeholder="John Doe">
                            </div>
                            <div>
                                <label for="email" class="block font-bold mb-2">Email *</label>
                                <input type="email" id="email" name="email" required class="w-full bg-[#f4f4f4] border-4 border-brand-black p-3 font-medium transition-all" placeholder="john@example.com">
                            </div>
                        </div>

                        <div>
                            <label for="subject" class="block font-bold mb-2">Subject</label>
                            <input type="text" id="subject" name="subject" class="w-full bg-[#f4f4f4] border-4 border-brand-black p-3 font-medium transition-all" placeholder="Speaking gig, Consultation, etc.">
                        </div>

                        <div>
                            <label for="message" class="block font-bold mb-2">Message *</label>
                            <textarea id="message" name="message" rows="5" required class="w-full bg-[#f4f4f4] border-4 border-brand-black p-3 font-medium transition-all resize-none" placeholder="How can we collaborate?"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-brand-blue text-white font-display font-bold text-xl py-4 border-4 border-brand-black brutal-shadow brutal-hover-blue transition-all">
                            SEND MESSAGE
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-brand-black text-white text-center py-10 border-t-4 border-brand-black mt-auto">
        <p class="font-display text-lg font-bold">© 2026 Anthony Nduka. All Rights Reserved.</p>
    </footer>

</body>
</html>
